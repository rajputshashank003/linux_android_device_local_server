<style>
:root{color-scheme:light;--page:#f2f7f3;--surface:#fff;--surface-2:#f7faf8;--surface-muted:var(--surface-2);--ink:#193b2d;--muted:#668071;--line:#dce8df;--green:#16804d;--green-dark:#0e663c;--danger:#a93226;--shadow:0 12px 34px #163a2510}*{box-sizing:border-box}html[data-theme="dark"]{color-scheme:dark;--page:#111614;--surface:#1a211d;--surface-2:#202923;--surface-muted:var(--surface-2);--ink:#e5eee8;--muted:#a1b0a7;--line:#35423a;--green:#72d69b;--green-dark:#a1e8b9;--danger:#ff9287;--shadow:0 12px 34px #0004}body{margin:0;min-height:100vh;background:var(--page);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}.host-shell{width:min(1120px,100% - 36px);margin:0 auto;padding:24px 0 54px}.host-header{display:flex;align-items:center;gap:18px;justify-content:space-between;padding:8px 0 22px;border-bottom:1px solid var(--line)}.host-brand{display:flex;align-items:center;gap:12px;min-width:0}.host-mark{width:42px;height:42px;border-radius:13px;background:var(--green);display:grid;place-items:center;color:#fff;font-size:20px;font-weight:800}.host-brand strong{display:block;font-size:17px}.host-brand small{color:var(--muted)}.host-header-actions{display:flex;align-items:center;gap:10px}.home-link,.host-nav a,.button{min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--ink);font-weight:650;cursor:pointer}.home-link:hover,.host-nav a:hover,.button.secondary:hover{background:var(--surface-2);border-color:var(--green)}.host-nav{display:flex;gap:8px;padding:18px 0 7px;overflow-x:auto}.host-nav a{white-space:nowrap;background:transparent}.host-nav a[aria-current="page"]{background:var(--surface);border-color:var(--green);color:var(--green-dark)}.host-main{min-height:55vh;padding-top:16px}.page-heading{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:10px 0 22px}.page-heading h1{margin:0;font-size:clamp(27px,4vw,36px);letter-spacing:-.035em;line-height:1.15}.page-heading p{margin:7px 0 0;color:var(--muted)}.summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 24px}.summary-card,.action-card,.deployment-card,.detail-card,.empty-state,.message{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.summary-card{padding:15px}.summary-card span{display:block;color:var(--muted);font-size:13px}.summary-card strong{display:block;margin-top:5px;font-size:27px;line-height:1.2}.runtime-note{padding:11px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:13px;margin-bottom:22px}.runtime-note.warning{border-color:color-mix(in srgb,#d29c2d 55%,var(--line));color:var(--ink)}.action-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.action-card{padding:24px;min-height:210px;display:flex;flex-direction:column;align-items:flex-start}.action-icon{width:48px;height:48px;border-radius:14px;background:color-mix(in srgb,var(--green) 14%,var(--surface));color:var(--green-dark);display:grid;place-items:center;font-size:23px}.action-card h2{margin:15px 0 5px;font-size:20px}.action-card p{margin:0 0 18px;color:var(--muted);max-width:46ch}.action-card .button{margin-top:auto;background:var(--green);border-color:var(--green);color:#fff}.button:hover{filter:brightness(1.04)}.button:focus-visible,.home-link:focus-visible,.host-nav a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--green) 55%,transparent);outline-offset:2px}.button:disabled{opacity:.55;cursor:not-allowed}.button.secondary{background:var(--surface);color:var(--ink)}.button.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 48%,var(--line));background:var(--surface)}.page-actions,.button-row{display:flex;gap:9px;flex-wrap:wrap}.deployment-list{display:grid;gap:12px}.deployment-card{padding:17px}.deployment-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.deployment-top h2{margin:0;font-size:19px;overflow-wrap:anywhere}.deployment-top small{display:block;margin-top:4px;color:var(--muted);overflow-wrap:anywhere}.status{flex:none;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;font-weight:700;text-transform:capitalize}.status:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}.status.running:before{background:#2ea667}.status.failed:before{background:var(--danger)}.status.starting:before,.status.queued:before,.status.pulling:before{background:#d29c2d}.facts{display:flex;flex-wrap:wrap;gap:8px 18px;margin:13px 0;color:var(--muted);font-size:13px}.public-url{display:block;overflow-wrap:anywhere;color:var(--green-dark);font-size:13px;margin:8px 0}.deployment-card .button-row{margin-top:14px}.empty-state{padding:28px;text-align:center}.empty-state h2{margin:0 0 5px}.empty-state p{color:var(--muted);margin:0 0 16px}.form-card{padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:16px}.host-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.host-form label{display:grid;gap:6px;font-weight:650}.host-form .wide{grid-column:1/-1}.host-form input,.host-form textarea,.host-form select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink)}.host-form textarea{resize:vertical}.hint{font-size:13px;color:var(--muted);font-weight:400}.visibility{grid-column:1/-1;border:1px solid var(--line);border-radius:12px;padding:13px}.visibility legend{font-weight:700}.visibility label{display:flex;align-items:flex-start;gap:9px;font-weight:500}.visibility input{width:auto;margin-top:5px}.alert{padding:11px 14px;margin:14px 0;border:1px solid color-mix(in srgb,var(--danger) 45%,var(--line));border-radius:11px;color:var(--danger);background:var(--surface)}.alert[hidden]{display:none}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.detail-card{padding:18px;min-width:0}.detail-card.full{grid-column:1/-1}.detail-card h2{font-size:17px;margin:0 0 12px}.detail-row{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}.detail-row span{color:var(--muted)}.detail-row strong{text-align:right;overflow-wrap:anywhere}.log-output{max-height:360px;overflow:auto;padding:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 ui-monospace,monospace}.loading{color:var(--muted);padding:18px 4px}.footer-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.hidden{display:none!important}
@media(max-width:700px){.host-shell{width:min(100% - 24px,620px);padding-top:14px}.host-header{align-items:flex-start}.host-brand small{display:none}.host-header-actions{flex-direction:column;align-items:flex-end}.home-link{min-height:38px;padding:7px 10px}.host-nav{margin-right:-12px;padding-right:12px}.summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.action-grid,.detail-grid,.host-form{grid-template-columns:1fr}.detail-card.full,.host-form .wide,.visibility{grid-column:auto}.page-heading{align-items:flex-start;flex-direction:column}.deployment-top{align-items:flex-start}.deployment-card{padding:14px}}

<script>try{const t=localStorage.getItem('myforever-theme')||'system';const dark=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light'}catch{document.documentElement.dataset.theme='light'}</script>

<body><div class="host-shell">
<header class="host-header"><a class="host-brand" href="/" aria-label="MyFile home"><span class="host-mark" aria-hidden="true">M</span><span><strong>MyFile</strong><small>Application hosting</small></span></a><div class="host-header-actions"><button id="hostMenuToggle" class="shared-menu-trigger menu-trigger" type="button" aria-label="Open MyFile navigation" aria-haspopup="menu" aria-expanded="false" title="Open menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button></div></header>
<!-- MAIN_NAVIGATION_MENU -->
<nav class="host-nav" aria-label="Hosting navigation"><a href="/host" data-route="/host">Overview</a><a href="/host/new" data-route="/host/new">Host New</a><a href="/host/existing" data-route="/host/existing">See Existing</a></nav>
<main id="hostMain" class="host-main" tabindex="-1"><p class="loading" role="status">Loading hosting…</p></main>
</div>
<script>
(()=>{
'use strict';
const main=document.querySelector('#hostMain');let renderToken=0,pollTimer=null,busy=new Set();
const globalMenu=document.querySelector('#globalMenu'),menuTrigger=document.querySelector('#hostMenuToggle');
const themeNames={light:'Light',dark:'Dark',system:'Default / System'};
function applyTheme(value){if(!Object.hasOwn(themeNames,value))value='system';const dark=value==='dark'||(value==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light';document.querySelectorAll('[data-theme-value]').forEach(option=>option.setAttribute('aria-checked',String(option.dataset.themeValue===value)));document.querySelector('#themeCurrentLabel').textContent=themeNames[value]}
applyTheme(localStorage.getItem('myforever-theme')||'system');
const systemTheme=matchMedia('(prefers-color-scheme: dark)');const systemThemeChanged=()=>{if((localStorage.getItem('myforever-theme')||'system')==='system')applyTheme('system')};if(systemTheme.addEventListener)systemTheme.addEventListener('change',systemThemeChanged);else systemTheme.addListener?.(systemThemeChanged);
function closeMenu(){globalMenu.classList.add('hidden');document.querySelector('#themeMenuChoices').classList.add('hidden');document.querySelector('#themeMenuToggle').setAttribute('aria-expanded','false');menuTrigger.setAttribute('aria-expanded','false')}
function toggleMenu(){if(!globalMenu.classList.contains('hidden')){closeMenu();return}globalMenu.classList.remove('hidden');const r=menuTrigger.getBoundingClientRect(),w=Math.min(310,innerWidth-20);globalMenu.style.left=Math.max(10,Math.min(innerWidth-w-10,r.right-w))+'px';globalMenu.style.top=Math.max(10,Math.min(innerHeight-globalMenu.offsetHeight-10,r.bottom+8))+'px';menuTrigger.setAttribute('aria-expanded','true');document.querySelector('#menuHomeLink')?.classList.remove('hidden');document.querySelector('#menuAgenticLink')?.classList.remove('hidden');document.querySelector('#menuHostLink')?.classList.add('hidden')}
menuTrigger.addEventListener('click',toggleMenu);document.querySelector('#themeMenuToggle').addEventListener('click',()=>{const choices=document.querySelector('#themeMenuChoices'),open=choices.classList.toggle('hidden')===false;document.querySelector('#themeMenuToggle').setAttribute('aria-expanded',String(open))});
document.querySelectorAll('[data-theme-value]').forEach(option=>option.addEventListener('click',()=>{const value=option.dataset.themeValue;localStorage.setItem('myforever-theme',value);applyTheme(value);closeMenu()}));
document.addEventListener('pointerdown',event=>{if(!globalMenu.contains(event.target)&&!event.target.closest('.menu-trigger'))closeMenu()});document.addEventListener('keydown',event=>{if(event.key==='Escape')closeMenu()});

const safeId=id=>/^[a-f0-9]{32}$/.test(id);
const paths=['/host','/host/new','/host/existing'];
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=String(text);return n}
function link(label,path,cls='button'){const a=el('a',cls,label);a.href=path;a.dataset.route=path;return a}
function button(label,fn,cls='button secondary'){const b=el('button',cls,label);b.type='button';b.addEventListener('click',fn);return b}
async function api(url,options={}){const response=await fetch(url,{credentials:'same-origin',...options});const body=await response.text();let data={};try{data=body?JSON.parse(body):{}}catch{data={error:body||`Request failed (${response.status})`}}if(!response.ok){const error=new Error(data.error||`Request failed (${response.status})`);error.status=response.status;throw error}return data}
function errorBox(message){const box=el('div','alert',message);box.setAttribute('role','alert');return box}
function heading(title,subtitle){const h=el('header','page-heading');h.append(el('div'));h.firstChild.append(el('h1','',title),el('p','',subtitle));return h}
function shell(title,subtitle){main.replaceChildren();const h=heading(title,subtitle);main.append(h);return main}
function date(value){if(!value)return 'Not available';const d=new Date(value);return Number.isNaN(d.getTime())?String(value):d.toLocaleString()}
function publicUrl(app){if(!app.public||typeof app.publicUrl!=='string'||!safeId(app.id)||app.publicUrl!==`/hosted/${app.id}/`||location.protocol!=='https:')return null;return new URL(app.publicUrl,location.origin).href}
function navState(path){for(const a of document.querySelectorAll('[data-route]')){if(a.matches('.host-nav a')){const selected=a.dataset.route===(path==='/host/new'?'/host/new':path==='/host/existing'||path.startsWith('/deployed/')?'/host/existing':'/host');if(selected)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')}}}
function go(path,replace=false){if(!paths.includes(path)&&!/^\/deployed\/[A-Za-z0-9_-]{1,64}$/.test(path))path='/host';history[replace?'replaceState':'pushState']({},'',path);render()}
function clearPoll(){if(pollTimer){clearTimeout(pollTimer);pollTimer=null}}
function schedule(path){clearPoll();pollTimer=setTimeout(()=>{if(location.pathname===path)render()},2500)}
function metric(label,value){const card=el('article','summary-card');card.append(el('span','',label),el('strong','',value));return card}
function appendResources(note,status){const r=status.resources||{},parts=[];if(Number.isFinite(r.memoryAvailableBytes))parts.push(`RAM available ${(r.memoryAvailableBytes/1073741824).toFixed(2)} GiB`);else parts.push('RAM metric unavailable');if(Number.isFinite(r.activeDeployments))parts.push(`${r.activeDeployments} active deployment${r.activeDeployments===1?'':'s'}`);const warnings=Array.isArray(r.warnings)?r.warnings:[];note.textContent+=' · '+parts.join(' · ')+(warnings.length?' · Warning: '+warnings.join(' '):'');if(warnings.length)note.classList.add('warning')}
async function overview(token){shell('My Hosting','Deploy, manage, and monitor your applications from one place.');const grid=el('section','summary-grid');const names=[['Deployments','total'],['Running applications','running'],['Stopped applications','stopped'],['Published applications','published']];const cards=names.map(([label,key])=>{const c=metric(label,'—');c.dataset.metric=key;grid.append(c);return c});main.append(grid);const note=el('p','runtime-note','Loading hosting runtime status…');main.append(note);const actions=el('section','action-grid');for(const [title,desc,icon,label,path] of [['Host New','Deploy a new application to your hosting environment.','↗','Host New','/host/new'],['See Existing','View and manage applications that have already been deployed.','▤','See Existing','/host/existing']]){const card=el('article','action-card'),ico=el('span','action-icon',icon);ico.setAttribute('aria-hidden','true');card.append(ico,el('h2','',title),el('p','',desc),link(label,path,'button'));actions.append(card)}main.append(actions);try{const [status,data]=await Promise.all([api('/api/hosting/status'),api('/api/hosting/apps')]);if(token!==renderToken)return;const apps=Array.isArray(data.apps)?data.apps:[];const counts={total:apps.length,running:apps.filter(a=>a.running&&a.status==='running').length,stopped:apps.filter(a=>['stopped','failed'].includes(a.status)||!a.running&&!['queued','pulling','starting','stopping'].includes(a.status)).length,published:apps.filter(a=>a.public).length};for(const c of cards)c.querySelector('strong').textContent=String(counts[c.dataset.metric]);note.textContent=`${status.runtime?.name||'Hosting runtime'} · ${status.available?'Available':'Unavailable'} · ${Number.isFinite(status.storageFreeBytes)?`${(status.storageFreeBytes/1073741824).toFixed(1)} GiB free`:'Free storage unavailable'} · ${status.security||'Runtime security details unavailable'}`;appendResources(note,status);if(apps.some(a=>['queued','pulling','starting','stopping'].includes(a.status)))schedule('/host')}catch(e){if(token===renderToken){note.textContent='Hosting summary is unavailable.';main.append(errorBox(e.message))}}}
async function newDeployment(token){
shell('Host New','Deploy an OCI image or a public GitHub Node.js application on this device.');
const note=el('p','runtime-note','Checking hosting runtimes…');main.append(note);
const form=el('form','form-card host-form');
form.innerHTML='<label>Application name (optional)<input name="name" maxlength="80" placeholder="Auto-detected from image"><span class="hint">Leave blank to use the image or repository name.</span></label><label class="wide">Deployment type<select name="deploymentType"><option value="oci">OCI / Docker image (PRoot-Distro)</option><option value="node-source">GitHub Node.js source (ARM64 Termux Node.js)</option></select></label><div class="source-hint wide hint hidden" id="nodeSourceHint">This mode clones a public GitHub repository and runs its npm start script directly with ARM64 Termux Node.js. It assigns a unique loopback port and adapts common Node listen calls. Requires package.json, package-lock.json, and an npm start script. Only deploy source you trust; this process runs as the Termux user.</div><label class="wide" id="imageField">Docker / OCI image reference<input name="image" maxlength="256" placeholder="nginx:alpine" required><span class="hint">Pulls the native device architecture when the image publishes it. The image must be compatible with PRoot; Docker Engine features, privileged mode, host mounts, and enforced resource limits are not provided.</span></label><label id="sourceOwnerField" class="hidden">GitHub owner<input name="sourceOwner" maxlength="39" placeholder="rajputshashank" disabled></label><label id="sourceRepositoryField" class="hidden">Repository<input name="sourceRepository" maxlength="100" placeholder="sum-server" disabled></label><label id="sourceBranchField" class="hidden">Branch<input name="sourceBranch" maxlength="100" value="main" disabled></label><label>Application port (auto-detect when blank)<input name="port" type="number" min="1" max="65535" value="" placeholder="Blank: use one declared TCP EXPOSE port"><span class="hint">If the image declares zero or multiple TCP EXPOSE ports, supply the HTTP listening port. The current public proxy supports HTTP applications, not raw Redis/PostgreSQL protocols.</span></label><label>Health-check path<input name="healthPath" maxlength="512" value="/" required></label><label class="wide" id="commandField">Optional command override (JSON argument array)<input name="command" placeholder="[&quot;node&quot;,&quot;server.js&quot;]"></label><label class="wide">Environment (one KEY=value per line)<textarea name="environment" rows="4" autocomplete="off" spellcheck="false"></textarea></label><p class="wide hint" id="runtimeHint">OCI images must match this device architecture. PRoot is not Docker Engine: it has no Docker networking/port mapping or kernel isolation and does not enforce CPU/RAM limits. The image must honor PORT or be compatible with the assigned host port. Only HTTP is proxied; app ports may be reachable on the LAN.</p><fieldset class="visibility"><legend>Publication visibility</legend><label><input name="public" type="checkbox"> Publish at a stable HTTPS application path</label><p class="hint">Public applications bypass MyFile password authentication on their app route. Private applications stay protected. Only publish trusted applications.</p></fieldset><button class="button wide" type="submit">Prepare and start application</button>';
main.append(form);
const type=form.elements.deploymentType;
function updateSourceFields(){const source=type.value==='node-source';for(const id of ['sourceOwnerField','sourceRepositoryField','sourceBranchField']){const field=document.getElementById(id);field.classList.toggle('hidden',!source);field.querySelector('input').disabled=!source;field.querySelector('input').required=source}document.querySelector('#nodeSourceHint').classList.toggle('hidden',!source);document.querySelector('#imageField').classList.toggle('hidden',source);form.elements.image.disabled=source;form.elements.image.required=!source;document.querySelector('#commandField').classList.toggle('hidden',source);form.elements.port.min=source?'1024':'1';form.elements.port.value=source?'8080':'';form.elements.port.required=source;document.querySelector('#runtimeHint').textContent=source?'Dependencies are installed with npm ci on this ARM64 Termux device; dependency install scripts are disabled. The app runs directly as the Termux user without PRoot filesystem isolation.':'OCI images must match this device architecture. PRoot is not Docker Engine: it has no Docker networking/port mapping or kernel isolation and does not enforce CPU/RAM limits. The image must honor PORT or be compatible with the assigned host port. Only HTTP is proxied; app ports may be reachable on the LAN.'}
type.addEventListener('change',updateSourceFields);
form.addEventListener('submit',async event=>{
event.preventDefault();const submit=form.querySelector('[type=submit]');let command=[],environment={};
try{const raw=form.elements.command.value.trim();if(type.value==='oci'&&raw){command=JSON.parse(raw);if(!Array.isArray(command)||command.some(v=>typeof v!=='string'))throw Error('Command must be a JSON array of strings.')}}catch(e){main.append(errorBox(e.message||'Command override must be a JSON array of strings.'));return}
for(const line of form.elements.environment.value.split(/\r?\n/)){if(!line.trim())continue;const at=line.indexOf('=');if(at<1){main.append(errorBox('Environment entries must use KEY=value format.'));return}environment[line.slice(0,at).trim()]=line.slice(at+1)}
if(form.elements.public.checked&&!confirm('Public applications bypass MyFile authentication. Continue only for an application you trust.'))return;
submit.disabled=true;submit.textContent=type.value==='node-source'?'Cloning and installing…':'Preparing image…';note.textContent=type.value==='node-source'?'Downloading the GitHub source and installing production dependencies on this ARM64 device…':'Deployment request accepted; preparing the image and starting the application…';
try{const source=type.value==='node-source',url=source?'/api/hosting/source':'/api/hosting/apps';const inferredName=source?form.elements.sourceRepository.value.trim():form.elements.image.value.trim().split('/').pop().split('@')[0].split(':')[0];const payload={name:form.elements.name.value.trim()||inferredName||'Hosted app',image:form.elements.image.value,containerPort:form.elements.port.value?Number(form.elements.port.value):null,healthPath:form.elements.healthPath.value,command,environment,public:form.elements.public.checked};if(source){payload.owner=form.elements.sourceOwner.value;payload.repository=form.elements.sourceRepository.value;payload.branch=form.elements.sourceBranch.value;delete payload.image;delete payload.command}const result=await api(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!safeId(result.id))throw Error('The server did not return a valid deployment ID.');go('/deployed/'+result.id)}catch(e){submit.disabled=false;submit.textContent='Retry deployment';note.textContent='Deployment failed. Your form values are still available.';main.append(errorBox(e.message))}
});
try{const status=await api('/api/hosting/status');if(token===renderToken){const node=status.nodeSource;const summary=(status.backends||[]).map(item=>`${item.name}: ${item.status}`).join(' · ');note.textContent=`${summary||`OCI: ${status.runtime?.name||'PRoot-Distro'} ${status.available?'available':'unavailable'}`} · Node source: ${node?.available?`${node.version} (${node.architecture})`:'unavailable'} · ${status.security||'Runtime details unavailable'}`;appendResources(note,status)}}catch(e){if(token===renderToken){note.textContent='Hosting runtime status is unavailable.';main.append(errorBox(e.message))}}
}
async function existing(token){shell('See Existing','Review applications managed by this MyFile hosting service.');const actions=el('div','page-actions');actions.append(button('Refresh',()=>render()),link('Host New','/host/new'));main.append(actions);const list=el('section','deployment-list');list.append(el('p','loading','Loading deployments…'));main.append(list);try{const [data,status]=await Promise.all([api('/api/hosting/apps'),api('/api/hosting/status')]);if(token!==renderToken)return;const apps=Array.isArray(data.apps)?data.apps:[];list.replaceChildren();if(!apps.length){const empty=el('div','empty-state');empty.append(el('h2','','No deployments yet'),el('p','','Create your first hosted application to see it here.'),link('Host New','/host/new','button'));list.append(empty)}else for(const app of apps)list.append(deploymentCard(app));const note=el('p','runtime-note',`${status.runtime?.name||'Hosting runtime'} · ${status.available?'Available':'Unavailable'} · ${Number.isFinite(status.storageFreeBytes)?`${(status.storageFreeBytes/1073741824).toFixed(1)} GiB free`:'Storage unavailable'}`);appendResources(note,status);main.append(note);if(apps.some(a=>['queued','pulling','starting','stopping'].includes(a.status)))schedule('/host/existing')}catch(e){if(token===renderToken){list.replaceChildren(errorBox(e.message))}}}
function deploymentCard(app){const card=el('article','deployment-card'),top=el('div','deployment-top'),names=el('div');names.append(el('h2','',app.name||'Unnamed application'),el('small','',`${app.deploymentType==='node-source'&&app.source?`Node.js · GitHub ${app.source.owner}/${app.source.repository}@${app.source.branch}`:(app.image_reference||'Unknown image')} · ID ${app.id}`),el('span','status '+(app.status||'unknown'),app.status||'Unknown'));top.append(names);card.append(top);const facts=el('div','facts');facts.append(el('span','',`Health: ${app.running&&app.status==='running'?'Ready':'Not ready'}`),el('span','',`Runtime: ${app.runtimeBackend||'Unavailable'}`),el('span','',`Architecture: ${app.imageArchitecture||app.hostArchitecture||'Unavailable'}`),el('span','',`Host port: ${app.host_port}`),el('span','',`Created: ${date(app.created_at)}`),el('span','',`Visibility: ${app.public?'Public':'Private'}`));card.append(facts);const url=publicUrl(app);if(url){const a=el('a','public-url',url);a.href=url;a.target='_blank';a.rel='noopener noreferrer';card.append(a)}const row=el('div','button-row');row.append(link('View Details','/deployed/'+encodeURIComponent(app.id)),button(app.running?'Stop':'Start',()=>action(app.id,app.running?'stop':'start'),'button secondary'));card.append(row);return card}
async function details(id,token){shell('Deployment details','Inspect this application, its access settings, health, and lifecycle.');if(!safeId(id)){main.append(errorBox('This deployment ID is invalid.'),link('View all deployments','/host/existing'));return}const loading=el('p','loading','Loading deployment details…');main.append(loading);try{const app=await api('/api/hosting/apps/'+encodeURIComponent(id));if(token!==renderToken)return;if(app.id!==id)throw Object.assign(Error('Deployment not found.'),{status:404});loading.remove();const grid=el('div','detail-grid');const overview=el('section','detail-card');overview.append(el('h2','','Application overview'),el('span','status '+app.status,app.status));for(const [k,v] of [['Deployment ID',app.id],[app.deploymentType==='node-source'?'Node.js source':'Image',app.deploymentType==='node-source'&&app.source?`${app.source.owner}/${app.source.repository}@${app.source.branch}`:app.image_reference],['Container port',app.container_port],['Host port',app.host_port],['Created',date(app.created_at)],['Updated',date(app.updated_at)],['Runtime backend',app.runtimeBackend],['Execution mode',app.executionMode],['Device architecture',app.hostArchitecture],['Image architecture',app.imageArchitecture||'Unavailable'],['Image exposed ports',app.imageConfiguration?.exposedPorts?.join(', ')||'None declared'],['Health',app.running&&app.status==='running'?'Ready':'Not currently ready'],['Process state',app.running?'Process running':'Process stopped']]){const row=el('div','detail-row');row.append(el('span','',k),el('strong','',v??'Not available'));overview.append(row)}if(app.error)overview.append(errorBox(app.error));grid.append(overview);const access=el('section','detail-card');access.append(el('h2','','Application access'));if(app.public){access.append(el('p','',app.running?'Published · application route is public while running.':'Published · application is currently stopped.'));const url=publicUrl(app);if(url){const a=el('a','public-url',url);a.href=url;a.target='_blank';a.rel='noopener noreferrer';access.append(a);const row=el('div','button-row'),open=el('a','button','Open Application');open.href=url;open.target='_blank';open.rel='noopener noreferrer';row.append(open,button('Copy link',async()=>{try{await navigator.clipboard.writeText(url)}catch{main.append(errorBox('Clipboard access unavailable. Copy the URL shown above.'))}}));access.append(row)}else access.append(el('p','hint','Open this page over HTTPS to resolve the published application URL.'))}else{access.append(el('p','hint','Private · this route requires MyFile authentication.'),el('code','public-url',app.route||`/hosted/${id}/`))}grid.append(access);const controls=el('section','detail-card full');controls.append(el('h2','','Deployment controls'));const row=el('div','button-row'),pending=['queued','pulling','starting','stopping'].includes(app.status)||busy.has(id);for(const [name,label] of [['start','Start'],['stop','Stop'],['restart','Restart'],['redeploy','Redeploy'],['publish',app.public?'Unpublish':'Publish'],['delete','Delete']]){const b=button(label,()=>action(id,name,name==='publish'?!app.public:undefined),name==='delete'?'button danger':'button secondary');b.disabled=pending||((name==='stop'||name==='restart')&&!app.running)||(name==='start'&&app.running)||(name==='publish'&&!app.public&&!app.running)||((name==='redeploy')&&['queued','pulling'].includes(app.status));row.append(b)}controls.append(row);grid.append(controls);const diagnostics=el('section','detail-card full');diagnostics.append(el('h2','','Health and diagnostics'),el('div','detail-row',`Controller state: ${app.status}`),el('div','detail-row',`Runtime state: ${app.running?'process is running':'process is not running'}`));if(app.job)diagnostics.append(el('p','hint',`Current operation: ${app.job.progress||app.job.status}`));if(Array.isArray(app.unsupportedRequirements)&&app.unsupportedRequirements.length){const warnings=el('div','runtime-note warning');warnings.textContent=app.unsupportedRequirements.join(' ');diagnostics.append(warnings)}if(app.imageConfiguration?.dockerHealthcheckConfigured)diagnostics.append(el('p','hint','This image declares a Docker HEALTHCHECK; the hosting controller does not execute that check. Readiness uses the configured HTTP health path.'));if(app.imageConfiguration?.volumeDeclarations)diagnostics.append(el('p','hint',`Image declares ${app.imageConfiguration.volumeDeclarations} VOLUME path(s); persistent host volume mapping is not supported.`));if(app.error)diagnostics.append(errorBox(app.error));const log=el('pre','log-output hidden',''),loadLogs=button('Load application logs',async()=>{loadLogs.disabled=true;try{const logs=await api('/api/hosting/apps/'+encodeURIComponent(id)+'/logs');log.textContent=logs.logs||'No application logs are available.';log.classList.remove('hidden')}catch(e){diagnostics.append(errorBox(e.message))}finally{loadLogs.disabled=false}});diagnostics.append(loadLogs,log);grid.append(diagnostics);main.append(grid);const footer=el('div','footer-links');footer.append(link('← Back to Hosting','/host'),link('View All Deployments','/host/existing'));main.append(footer);if(['queued','pulling','starting','stopping'].includes(app.status))schedule('/deployed/'+id)}catch(e){if(token===renderToken)main.replaceChildren(errorBox(e.status===404?'This deployment was not found or is no longer available.':e.message),link('View All Deployments','/host/existing'))}}
async function action(id,name,pub){if(!safeId(id)||busy.has(id))return;if(name==='delete'&&!confirm('Delete this deployment and its downloaded image? This cannot be undone.'))return;if(name==='redeploy'&&!confirm('Re-pull and recreate this application from its image?'))return;if(name==='publish'&&pub&&!confirm('Publishing makes this application route public without MyFile authentication. Continue only for a trusted application.'))return;busy.add(id);const progress=el('p','runtime-note',`${name[0].toUpperCase()+name.slice(1)} request in progress…`);progress.setAttribute('role','status');main.prepend(progress);main.setAttribute('aria-busy','true');try{await api('/api/hosting/apps/'+encodeURIComponent(id),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:name,confirm:name==='delete'?id:undefined,public:name==='publish'?pub:undefined})});busy.delete(id);if(name==='delete'){go('/host/existing');return}await render()}catch(e){busy.delete(id);await render();main.prepend(errorBox(e.message))}finally{main.removeAttribute('aria-busy')}}
async function render(){clearPoll();const token=++renderToken;document.title=(location.pathname==='/host/new'?'Host New':location.pathname==='/host/existing'?'See Existing':location.pathname.startsWith('/deployed/')?'Deployment details':'My Hosting')+' · MyFile';navState(location.pathname);const path=location.pathname.replace(/\/$/,'')||'/host';if(path==='/host/new')return newDeployment(token);if(path==='/host/existing')return existing(token);if(path.startsWith('/deployed/'))return details(path.slice('/deployed/'.length),token);return overview(token)}
document.addEventListener('click',event=>{const a=event.target.closest('a[data-route]');if(!a||event.defaultPrevented||event.button!==0||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;const url=new URL(a.href,location.href);if(url.origin!==location.origin)return;event.preventDefault();go(url.pathname)});window.addEventListener('popstate',render);render();
})();
